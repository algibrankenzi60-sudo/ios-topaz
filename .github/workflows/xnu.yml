name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      topaz_4k:
        description: Build the experimental 4 KiB XNU configuration (not validated for iOS userland)
        type: boolean
        default: true
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main, "codex/j2prime-early-bringup"]
    paths:
      - "xnu/patches/**"
      - "tools/test_j2prime_*.py"
      - ".github/workflows/xnu.yml"


concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || (github.ref == 'refs/heads/codex/j2prime-early-bringup' && 'J2PRIME') || 'SWEET' }}
  # patch 0140 consumes TOPAZ_4K=1 in XNU's makefiles.
  # J2PRIME has a fixed 4 KiB page size; on push there are no workflow inputs.
  TOPAZ_4K: ${{ (inputs.topaz_4k || inputs.machine_config == 'J2PRIME' || github.ref == 'refs/heads/codex/j2prime-early-bringup') && '1' || '0' }}
  # ccache: xnu is ~2000 compiles; a patch usually changes a few of them
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_macro,pch_defines
  CCACHE_MAXSIZE: 3G
  CCACHE_WRAP: ${{ github.workspace }}/ccache-bin

jobs:
  build:
    # Xcode 16's iig requires IORPC.kernelContent; patch 0959 backports the
    # matching kernel-only field. Use Intel macOS to avoid the constrained M1 pool.
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Validate J2 Prime diagnostic alias handoff order
        run: python3 tools/test_j2prime_alias.py

      - name: Validate J2 Prime RAM-console exception trace
        run: python3 tools/test_j2prime_ramconsole.py

      - name: Validate J2 Prime thread-call panic diagnostics
        run: python3 tools/test_j2prime_thread_call_panic.py

      - name: Validate J2 Prime zero-deadline call handling
        run: python3 tools/test_j2prime_zero_deadline.py

      - name: Validate J2 Prime built-in PRNG registration
        run: python3 tools/test_j2prime_builtin_prng.py

      - name: Validate J2 optional trust-cache runtime
        run: python3 tools/test_j2prime_optional_trust_cache.py

      - name: Validate J2 Prime IOKit platform expert
        run: python3 tools/test_j2prime_platform_expert.py

      - name: Validate Xcode 16 IORPC compatibility patch
        run: python3 tools/test_xcode16_iorpc_patch.py

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # The upstream helper normally warns and continues when a patch does not apply.
          # Fail before the expensive build if any required J2 patch is skipped.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dxb/build.sh")
          source = p.read_text()
          old_clone = '        git clone --branch "${XNU_VERSION}" https://github.com/apple-oss-distributions/xnu.git "${WORK_DIR}/xnu"'
          new_clone = '''        # XNU is a large repository; GitHub-hosted runners occasionally lose the
          # HTTP/2 stream partway through the initial packfile. Fetch only the
          # release tag, use HTTP/1.1, and retry from a clean destination.
          clone_ok=0
          for attempt in 1 2 3; do
              rm -rf "${WORK_DIR}/xnu"
              if git -c http.version=HTTP/1.1 -c http.lowSpeedLimit=0 \\
                  clone --depth 1 --single-branch --branch "${XNU_VERSION}" \\
                  https://github.com/apple-oss-distributions/xnu.git "${WORK_DIR}/xnu"; then
                  clone_ok=1
                  break
              fi
              warning "XNU clone attempt ${attempt}/3 failed; retrying"
              sleep $((attempt * 5))
          done
          if [ "${clone_ok}" -ne 1 ]; then
              error "Unable to fetch XNU release ${XNU_VERSION} after 3 attempts"
              return 1
          fi'''
          if source.count(old_clone) != 1:
              raise SystemExit("Pinned build.sh XNU clone command changed; refusing an unverified rewrite")
          source = source.replace(old_clone, new_clone)
          old = '                warning "Skipping patch ${PATCH} (already upstream, previously applied, or malformed): ${APPLY_CHECK}"'
          new = '''                if [[ "${PATCH##*/}" == 095[1-9]-j2prime-* || "${PATCH##*/}" == 096[0-5]-j2prime-* ]]; then
                    printf 'Required J2 Prime patch failed: %s\\n%s\\n' "$PATCH" "$APPLY_CHECK" >&2
                    exit 1
                fi
                warning "Skipping patch ${PATCH} (already upstream, previously applied, or malformed): ${APPLY_CHECK}"'''
          if source.count(old) != 1:
              raise SystemExit("Pinned build.sh patch-skip clause changed; refusing an unverified rewrite")
          p.write_text(source.replace(old, new))
          PY
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64.
          # topaz: Cortex-A53/A73 (ARMv8.0), so the same -mcpu as the kernel
          # (clang's apple-m1 default emits LSE atomics and LDAPR)
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"/' dxb/build.sh
          grep -c 'OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"' dxb/build.sh
          # xnu's makedefs take CC/CXX from the environment dxb exports; xcodebuild
          # (mig, ctf tools) needs a single executable, so point at wrappers
          sed -i '' 's|export CC="$(xcrun -find clang)"|export CC="$CCACHE_WRAP/clang"|; s|export CXX="$(xcrun -find clang++)"|export CXX="$CCACHE_WRAP/clang++"|' dxb/build.sh
          grep -c 'export CC="$CCACHE_WRAP/clang"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja ccache
          # build.sh only checks that xcodes exists (Xcode is preinstalled)
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          test "$(uname -m)" = x86_64
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          test -d "$XC"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          XCODE_VERSION=$(xcodebuild -version)
          printf '%s\n' "$XCODE_VERSION"
          printf '%s\n' "$XCODE_VERSION" | grep -Eq '^Xcode 16\.'
          xcrun --find iig
          mkdir -p "$CCACHE_WRAP"
          for t in clang clang++; do
            printf '#!/bin/sh\nexec ccache %s "$@"\n' "$(xcrun -find $t)" > "$CCACHE_WRAP/$t"
            chmod +x "$CCACHE_WRAP/$t"
          done
          cat "$CCACHE_WRAP/clang"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-${{ hashFiles('xnu/patches/**', '.github/workflows/xnu.yml') }}
          restore-keys: |
            ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          ccache -z
          bash build.sh
          ccache -s

      - name: Verify J2 Prime RAM-console trace was applied and linked
        if: github.ref == 'refs/heads/codex/j2prime-early-bringup' || inputs.machine_config == 'J2PRIME'
        run: |
          grep -F 'J2 thread_call deadline invariant:' dxb/xnu/osfmk/kern/thread_call.c
          grep -F 'soft=%llx hard=%llx' dxb/xnu/osfmk/kern/thread_call.c
          python3 - <<'PY'
          from pathlib import Path
          source = Path('dxb/xnu/osfmk/console/video_console.c').read_text()
          assert 'if (deadline == 0)' in source
          assert 'thread_call_enter(call);' in source
          assert source.count('vc_thread_call_enter_deadline(') == 7
          assert source.count('thread_call_enter_delayed(') == 1
          PY
          python3 - <<'PY'
          from pathlib import Path
          prng = Path('dxb/xnu/osfmk/prng/prng_random.c').read_text()
          entropy = Path('dxb/xnu/osfmk/prng/entropy.c').read_text()
          assert prng.count('#if defined(SWEET) || defined(J2PRIME)') == 2
          assert 'J2PRIME PRNG: HMAC-SHA256 registered' in prng
          assert entropy.count('#if defined(SWEET) || defined(J2PRIME)') == 5
          PY
          python3 - <<'PY'
          from pathlib import Path
          trust = Path('dxb/xnu/bsd/kern/kern_trustcache.c').read_text()
          assert trust.count('#if defined(SWEET) || defined(J2PRIME)') == 6
          assert 'if (img4if == NULL || amfi == NULL)' in trust
          assert 'J2PRIME: trust caches unavailable' in trust
          PY
          python3 - <<'PY'
          from pathlib import Path
          tables = Path('dxb/xnu/iokit/KernelConfigTables.cpp').read_text()
          expert = Path('dxb/xnu/iokit/Kernel/arm/J2PrimePlatformExpert.cpp').read_text()
          files = Path('dxb/xnu/iokit/conf/files.arm64').read_text()
          config = Path('dxb/xnu/config/MASTER.arm64.j2prime').read_text()
          assert "'IONameMatch'     = 'samsung,j2prime';" in tables
          assert "'IONameMatch'     = 'samsung,sm-g532g';" in tables
          assert "'IOClass'         = J2PrimePlatformExpert;" in tables
          assert 'class J2PrimePlatformExpert : public IODTPlatformExpert' in expert
          assert 'J2PrimePlatformExpert::processTopLevel' in expert
          assert 'sweet_early_mark(16, "J2 expert start entered")' in expert
          assert 'sweet_early_mark(17, "J2 base expert start returned")' in expert
          assert 'sweet_early_mark(18, "J2 expert registered")' in expert
          assert 'sweet_early_mark(19, "J2 processTopLevel entered")' in expert
          assert 'sweet_early_mark(20, "J2 processTopLevel done")' in expert
          assert 'J2PrimePlatformExpert.cpp                  optional iokitcpp j2prime_platform' in files
          assert 'options j2prime_platform' in config
          makefile = Path('dxb/build/xnu.obj/DEVELOPMENT_ARM64_J2PRIME/iokit/DEVELOPMENT/Makefile').read_text()
          assert 'J2PrimePlatformExpert.cpo' in makefile
          assert Path('dxb/build/xnu.obj/DEVELOPMENT_ARM64_J2PRIME/iokit/DEVELOPMENT/J2PrimePlatformExpert.cpo').is_file()
          PY
          grep -q 'osfmk/arm64/j2prime_ramconsole.c' dxb/xnu/osfmk/conf/files.arm64
          grep -q 'osfmk/arm64/j2prime_exception_vectors.s' dxb/xnu/osfmk/conf/files.arm64
          grep -q 'j2prime_ramconsole_mark(27)' dxb/xnu/osfmk/arm64/arm_vm_init.c
          python3 - <<'PY'
          source = open('dxb/xnu/iokit/DriverKit/IORPC.h').read()
          start = source.index('struct IORPC {')
          end = source.index('\n};', start)
          field = source.index('IORPCMessage     * kernelContent;', start, end)
          assert source.rfind('#ifdef KERNEL', start, field) > start
          assert source.index('#endif /* KERNEL */', field, end) < end
          source = open('dxb/xnu/iokit/IOKit/IORPC.h').read()
          start = source.index('struct IORPC {')
          end = source.index('\n};', start)
          field = source.index('IORPCMessage     * kernelContent;', start, end)
          assert source.rfind('#ifdef KERNEL', start, field) > start
          assert source.index('#endif /* KERNEL */', field, end) < end
          PY
          python3 - <<'PY'
          from pathlib import Path
          makefile = Path("dxb/build/xnu.obj/DEVELOPMENT_ARM64_J2PRIME/osfmk/DEVELOPMENT/Makefile").read_text()
          assert "j2prime_ramconsole.o" in makefile
          assert "j2prime_exception_vectors.o" in makefile
          assert Path("dxb/build/xnu.obj/DEVELOPMENT_ARM64_J2PRIME/osfmk/DEVELOPMENT/j2prime_ramconsole.d").is_file()
          PY
          nm -gU dxb/fakeroot/System/Library/Kernels/kernel.development.j2prime > j2prime-kernel-symbols.txt
          grep -F '_j2prime_early_exception_record' j2prime-kernel-symbols.txt >/dev/null
          grep -F '_j2prime_early_vectors' j2prime-kernel-symbols.txt >/dev/null
          # Verify that the J2 config selects all four allocator RNG fallback sites.
          python3 - <<'PY'
          from pathlib import Path
          source = Path('dxb/xnu/osfmk/vm/vm_kern.c').read_text()
          assert source.count('#if defined(SWEET) || defined(J2PRIME)') == 4
          assert 'vm_size_t ctx_size = sizeof(struct sweet_kmem_rng);' in source
          assert '((struct sweet_kmem_rng *)ctx)->state = early_random();' in source
          assert 'sweet_kmem_uniform(zpercpu_get(sizeclass.ks_rng_ctx), num_slots)' in source
          PY
          PRNG_OBJ=dxb/build/xnu.obj/DEVELOPMENT_ARM64_J2PRIME/osfmk/DEVELOPMENT/prng_random.o
          test -f "$PRNG_OBJ"
          nm "$PRNG_OBJ" | grep -E 'sweet_prng_startup' >/dev/null
          # The J2 object must not call unregistered corecrypto kmem callbacks.
          VM_KERN_OBJ=dxb/build/xnu.obj/DEVELOPMENT_ARM64_J2PRIME/osfmk/DEVELOPMENT/vm_kern.o
          test -f "$VM_KERN_OBJ"
          if nm -u "$VM_KERN_OBJ" | grep -E 'crypto_random_kmem_ctx_size|crypto_random_kmem_init|crypto_random_uniform'; then
            echo 'J2 vm_kern.o still references the unavailable corecrypto kmem RNG' >&2
            exit 1
          fi

      - name: Package build tree for local compiles
        if: always()
        run: |
          if [ ! -d dxb/build/xnu.obj ] || [ ! -d dxb/xnu ]; then
            echo 'Build tree unavailable (setup/fetch failed); skipping diagnostic archive.'
            exit 0
          fi
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-${{ env.TOPAZ_4K == '1' && '4k' || '16k' }}
          path: out/
          if-no-files-found: warn
